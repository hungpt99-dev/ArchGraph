spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://postgres:5432/payments
    username: payments
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: kafka:9092
  data:
    redis:
      host: redis
      port: 6379
server:
  port: 8082
resilience4j:
  circuitbreaker:
    instances:
      stripe:
        slidingWindowSize: 20
