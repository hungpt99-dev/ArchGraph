name: archgraph

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://archgraph:${POSTGRES_PASSWORD:-archgraph}@postgres:5432/archgraph
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  REPO_STORAGE_DIR: /data/repos
  WORKSPACE_STORAGE_DIR: /data/workspaces
  ARCHGRAPH_ENV: ${ARCHGRAPH_ENV:-production}
  DEMO_MODE: ${DEMO_MODE:-false}
  ALLOW_LOCAL_REPOS: ${ALLOW_LOCAL_REPOS:-true}
  ALLOW_PRIVATE_NETWORKS: ${ALLOW_PRIVATE_NETWORKS:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-*}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  GITLAB_WEBHOOK_TOKEN: ${GITLAB_WEBHOOK_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archgraph}
      POSTGRES_DB: archgraph
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archgraph -d archgraph"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["python", "-m", "app.migrate"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    environment:
      <<: *backend-env
    volumes:
      - repo-data:/data
      - ./demo/repos:/demo/repos:ro
      - ${E2E_REPO_DIR:-./.e2e-repos}:/e2e-repos
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/archgraph-worker-heartbeat && test $$(( $$(date +%s) - $$(stat -c %Y /tmp/archgraph-worker-heartbeat) )) -lt 90"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      <<: *backend-env
    volumes:
      - repo-data:/data
      - ./demo/repos:/demo/repos:ro
      - ${E2E_REPO_DIR:-./.e2e-repos}:/e2e-repos
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  mcp:
    build: ./backend
    command: ["python", "-m", "app.mcp_server", "--http", "--port", "8787"]
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${MCP_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8787), 2).close()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  seed:
    build: ./backend
    command: ["sh", "-c", "mkdir -p /data/demo-src && cp -a /demo/repos/. /data/demo-src/ && sh /demo/init_repos.sh /data/demo-src && python -m app.seed_demo"]
    environment:
      <<: *backend-env
      DEMO_REPO_ROOT: /data/demo-src
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@archgraph.io}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-archgraph-demo-2026}
    volumes:
      - repo-data:/data
      - ./demo:/demo:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["demo"]
    restart: "no"

volumes:
  pgdata:
  repo-data:
